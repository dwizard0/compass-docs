site_name: COMPASS Documentation
site_description: Official documentation for the COMPASS crew management platform
site_url: https://compass.sfi.org/wiki/
repo_url: https://github.com/dwizard0/compass-docs
repo_name: compass-docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - assets/compass.css

nav:
  - Home: index.md
  - Commanding Officers:
    - Overview: co-guide/index.md
    - Getting Started: co-guide/getting-started.md
    - Command Dashboard: co-guide/command-dashboard.md
    - Managing Your Roster: co-guide/roster.md
    - Crew Transfers: co-guide/crew-transfers.md
    - Departments: co-guide/departments.md
    - Promotions: co-guide/promotions.md
    - Events: co-guide/events.md
    - Sharing Events Between Chapters: co-guide/event-sharing.md
    - Opening Event Points: co-guide/event-point-adjustments.md
    - Announcements and Social Posting: co-guide/announcements.md
    - Awards & Nominations: co-guide/awards.md
    - Reports: co-guide/reports.md
    - Ship Settings: co-guide/ship-settings.md
    - Delegating Command Authority: co-guide/delegation.md
    - Withdrawing Your Ship: co-guide/withdrawing.md
  - Crew Members:
    - Guide: crew/index.md
    - My Record and Service Record: crew/my-record.md
    - Events and RSVPs: crew/events-rsvp.md
    - Notifications: crew/notifications.md
    - Joining or Changing Ships: crew/changing-ships.md
    - How Promotion Points Work: reference/promotion-points.md
    - Requesting a Promotion (Unassigned): crew/unassigned-promotion.md
  - Regional Coordinators:
    - Overview: rc-guide/index.md
    - Regional Dashboard: rc-guide/regional-dashboard.md
    - Regional Reports: rc-guide/reports.md
    - Regional Positions: rc-guide/positions.md
    - Promotions: rc-guide/promotions.md
    - Awards: rc-guide/awards.md
    - Creating Regional Awards: rc-guide/regional-awards.md
    - Annual Awards: rc-guide/annual-awards.md
    - Regional and Fleet Events: rc-guide/events.md
    - Ship Lifecycle: rc-guide/ship-lifecycle.md
    - Chapters-in-Training: rc-guide/chapters-in-training.md
    - Unassigned Members: rc-guide/unassigned-members.md
    - Unassigned Member Promotions: rc-guide/unassigned-promotions.md
    - SFI Eligibility Sync: rc-guide/sfi-eligibility-sync.md
  - Reference:
    - Rank Chart: reference/ranks.md
    - Promotion Point System: reference/promotion-points.md
    - Glossary: reference/glossary.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - toc:
      permalink: true
